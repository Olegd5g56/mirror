# Общая конфигурация ротации логов docker — иначе json-file драйвер съест диск.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET}
  TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET}
  MEDIA_ROOT: /media
  DOMAIN: ${DOMAIN}
  TZ: ${TZ:-Europe/Kyiv}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *backend-env
    volumes:
      - ./media:/media
      - ./logs:/logs
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *backend-env
    volumes:
      - ./media:/media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # ffmpeg + jpeg в одной очереди, concurrency=1: иначе два ролика сожрут CPU
    command: celery -A app.tasks.celery_app worker -Q default --concurrency=1 --loglevel=info

  tusd:
    image: tusproject/tusd:v2.9.2
    restart: unless-stopped
    logging: *default-logging
    user: "1000:1000"
    volumes:
      - ./media/temp:/data
    command: >
      -upload-dir=/data
      -behind-proxy
      -base-path=/files/
      -hooks-http=http://backend:8000/api/hooks/tusd?secret=${TUSD_HOOK_SECRET}
      -hooks-enabled-events=pre-create,pre-finish
      -max-size=${MAX_UPLOAD_BYTES}
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      target: builder
    volumes:
      - frontend_build:/dist
    command: sh -c "find /dist -mindepth 1 -delete && cp -r /app/dist/. /dist/ && echo 'frontend build copied'"
    restart: "no"

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      # 8066 and 443 both reach the same site. Drop 8066 if nothing is pinned to that port.
      - "8066:443"
      - "443:443"
      # Редірект HTTP→HTTPS у nginx уже є. Щоб він працював, додай "80:80".
    environment:
      DOMAIN: ${DOMAIN}
      TLS_CERT_PATH: ${TLS_CERT_PATH}
      TLS_KEY_PATH: ${TLS_KEY_PATH}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./media:/media:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/api/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

volumes:
  postgres_data:
  frontend_build:
