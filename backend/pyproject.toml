[project]
name = "mirror-backend"
version = "0.1.0"
description = "Mirror backend: API + Celery worker"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.20",

    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",

    "redis>=5.0",
    "celery[redis]>=5.4",

    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.0",

    "Pillow>=11.0",
    "python-magic>=0.4.27",

    "click>=8.1",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
